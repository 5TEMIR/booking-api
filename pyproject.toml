[tool.poetry]
name = "booking-api"
package-mode = false


[tool.poetry.dependencies]
python = "^3.13.12"
alembic = "^1.19.2"
fastapi = "^0.141.1"
sqlalchemy = "^2.0.52"
pydantic-settings = "^2.15.0"
uvicorn = "^0.52.4"
pydantic = "^2.13.5"
aiosqlite = "^0.22.1"


[tool.poetry.group.dev.dependencies]
pytest = "^9.1.1"
pytest-asyncio = "^1.4.0"
httpx = "^0.28.1"


[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)",
    "httpx (>=0.28.1,<0.29.0)"
]
